services:
  - type: web
    name: app-comanda
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "8080"
      - key: FLASK_ENV
        value: "production"
