<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e7">
  <meta name="description" content="Comanda compartida para mesas, pedidos y cocina.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <title>Comanda | Bar</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Comanda, inicio">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span>comanda<span class="brand-dot">.</span></span>
    </a>
    <div class="topbar-tools">
      <span class="sync-state" id="syncState"><span class="sync-dot"></span><span>Conectando</span></span>
      <label class="waiter-field"><span>Atiende</span><input id="waiterName" maxlength="40" aria-label="Nombre de quien atiende" value="Equipo"></label>
      <button class="icon-button install-button" id="installButton" type="button" title="Instalar aplicación" aria-label="Instalar aplicación" hidden>↓</button>
    </div>
  </header>

  <nav class="main-nav" aria-label="Secciones">
    <button class="nav-button active" type="button" data-view="home"><span aria-hidden="true">⌂</span>Inicio</button>
    <button class="nav-button" type="button" data-view="tables"><span aria-hidden="true">▦</span>Mesas</button>
    <button class="nav-button" type="button" data-view="kitchen"><span aria-hidden="true">♨</span>Cocina</button>
    <button class="nav-button" type="button" data-view="menu"><span aria-hidden="true">≡</span>Carta</button>
  </nav>

  <main id="app" class="page-content" aria-live="polite">
    <div class="loading-state"><span class="loader"></span>Conectando con la comanda…</div>
  </main>

  <dialog id="dialog" class="dialog">
    <form id="dialogForm" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow" id="dialogEyebrow"></p><h2 id="dialogTitle"></h2></div><button class="icon-button close-dialog" value="cancel" aria-label="Cerrar">×</button></div>
      <div id="dialogBody"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
