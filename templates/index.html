<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Comanda compartida para mesas, pedidos y cocina.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Comanda">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .ready-notice { position: sticky; top: 0; z-index: 2; width: min(1120px, calc(100% - 40px)); min-height: 82px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; margin: 14px auto 0; padding: 12px 18px; border: 3px solid #8b241b; border-radius: 9px; color: #fff; background: #b74739; box-shadow: 0 8px 24px rgba(85, 24, 18, .28); cursor: pointer; text-align: left; }
    .ready-notice[hidden] { display: none; }
    .ready-notice-icon { width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid currentColor; border-radius: 50%; font: 800 26px/1 'Manrope', sans-serif; }
    .ready-notice-copy { display: grid; gap: 2px; min-width: 0; }
    .ready-notice-copy strong { font: 800 17px/1.2 'Manrope', sans-serif; }
    .ready-notice-copy > span { font-size: 12px; font-weight: 700; }
    .ready-notice-items { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .92; }
    .ready-notice-action { padding: 9px 12px; border-radius: 5px; color: #71320c; background: #ffe0bf; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .ready-notice:hover { background: #a83a2e; }
    .order-row.ready-order { border-left: 4px solid #3ddc84; background: #0f2318; }
    @media (max-width: 760px) {
      .ready-notice { top: 58px; width: calc(100% - 20px); min-height: 76px; grid-template-columns: 34px minmax(0, 1fr); gap: 9px; margin-top: 8px; padding: 9px 11px; border-width: 2px; }
      .ready-notice-icon { width: 32px; height: 32px; font-size: 21px; }
      .ready-notice-copy strong { font-size: 14px; }
      .ready-notice-copy > span { font-size: 10px; }
      .ready-notice-action { grid-column: 2; justify-self: start; padding: 5px 8px; font-size: 10px; }
    }
    @media (max-width: 390px) { .ready-notice-items { max-width: 100%; } }
  </style>
  <title>Comanda | Bar</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Comanda, inicio">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span>comanda<span class="brand-dot">.</span></span>
    </a>
    <div class="topbar-tools">
      <span class="sync-state" id="syncState"><span class="sync-dot"></span><span>Conectando</span></span>
      <label class="waiter-field"><span>Atiende</span><input id="waiterName" maxlength="40" aria-label="Nombre de quien atiende" placeholder="Nombre del mozo/a" autocomplete="name"></label>
      <button class="icon-button install-button" id="installButton" type="button" title="Instalar aplicación" aria-label="Instalar aplicación" hidden>↓</button>
      <button class="icon-button" id="roleButton" type="button" title="Cambiar de perfil" aria-label="Cambiar de perfil" hidden>⇄</button>
    </div>
  </header>

  <nav class="main-nav" aria-label="Secciones">
    <button class="nav-button active" type="button" data-view="home"><span aria-hidden="true">⌂</span>Inicio</button>
    <button class="nav-button" type="button" data-view="tables"><span aria-hidden="true">▦</span>Mesas</button>
    <button class="nav-button" type="button" data-view="kitchen"><span aria-hidden="true">♨</span>Cocina</button>
    <button class="nav-button" type="button" data-view="menu"><span aria-hidden="true">≡</span>Carta</button>
  </nav>

  <button id="readyNotice" class="ready-notice" type="button" aria-live="assertive" hidden></button>

  <main id="app" class="page-content" aria-live="polite">
    <div class="loading-state"><span class="loader"></span>Conectando con la comanda…</div>
  </main>

  <dialog id="dialog" class="dialog">
    <form id="dialogForm" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow" id="dialogEyebrow"></p><h2 id="dialogTitle"></h2></div><button class="icon-button close-dialog" value="cancel" aria-label="Cerrar">×</button></div>
      <div id="dialogBody"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
